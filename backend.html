<!DOCTYPE html>

<style>

.big{max-width:100%;max-height:55vh;cursor:zoom-in}.big.z{max-height:none;cursor:zoom-out;width:200%;max-width:none}.zw{overflow:auto;max-height:60vh}
.marq{overflow:hidden}.trk{display:flex;gap:14px;width:max-content;animation:mv 40s linear infinite}.marq:hover .trk{animation-play-state:paused}.trk div{text-align:center;cursor:pointer}.trk img{height:200px;border-radius:10px}@keyframes mv{to{transform:translateX(-50%)}}

@media print{#side,header,.np{display:none!important}}
@media(max-width:800px){#login{flex-direction:column}#side{position:fixed;z-index:5;left:-280px;transition:.2s}#side.open{left:0}}
</style></head><body>
<div id="login"><div class="L"><img id="logo" width="130" alt=""><h2>USK SCHOOLMONEY</h2><h1>โรงเรียนอุทยานศึกษากระบี่</h1>
<p>ระบบสารสนเทศเพื่อการบริหารจัดการและวิเคราะห์ข้อมูลการเงินหอพักนักเรียน<br><small>(Student Dormitory Financial Management and Data Analysis Information System)</small></p><img id="ann" alt=""></div>
<div class="R"><h1>ยินดีต้อนรับเข้าสู่ระบบ</h1><p>กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p><div id="clk"></div><p id="dt"></p>
<label><b>ชื่อผู้ใช้งาน (Username)</b></label><input id="u" placeholder="ชื่อผู้ใช้งาน หรืออีเมล" autocomplete="username">
<label><b>รหัสผ่าน (Password)</b></label><input id="p" type="password" placeholder="กรอกรหัสผ่าน....." autocomplete="current-password">
<p id="err" style="color:red"></p><button class="bt" id="go">เข้าสู่ระบบ</button></div></div>
<div id="app" hidden><aside id="side"><div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><div class="ph"></div><div><b id="un"></b><br><small>ฝ่ายดูแลระบบ</small></div></div><div id="nav"></div><br><button class="bt o" id="out" style="width:100%">ออกจากระบบ</button></aside>
<section><header><button class="bt" id="mn">☰</button><h2 id="pt" style="flex:1;margin:0"></h2><span style="position:relative"><button class="bt" id="bell">🔔</button><i id="bn" hidden></i><div id="bd" hidden></div></span><span><b id="un2"></b><br><small>ฝ่ายดูแลระบบ</small></span><div class="ph"></div></header>
<div class="pad"><div class="np" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b id="stamp"></b><button class="bt" id="rf">รีเฟรสข้อมูลล่าสุด</button></div><div id="main"></div></div></section></div>
<div id="modal" hidden><div class="mb"></div></div>
<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const LOGO="",ANN="";/* ใส่ลิงก์โลโก้โรงเรียน และรูปประกาศหน้าล็อกอิน */
const IDLE_MIN=30;/* ออกจากระบบอัตโนมัติเมื่อไม่ใช้งาน (นาที) */
const cfg={apiKey:"AIzaSyCYzdTDDtasgznuTERAtFz4l_dk47eB42A",authDomain:"schoolmonnyusk.firebaseapp.com",projectId:"schoolmonnyusk",storageBucket:"schoolmonnyusk.firebasestorage.app",messagingSenderId:"1005787782841",appId:"1:1005787782841:web:46389eb63de7f65affc568"};
const SB_URL="https://ihagihlmaquzaniegcfp.supabase.co",SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloYWdpaGxtYXF1emFuaWVnY2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Njc5NzgsImV4cCI6MjEwODM0Mzk3OH0.BVZ8LHRsJArrxWge7B69wjBzyWP8VqHGPoU6iKqSjlw",BUCKET="usk";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),sb=createClient(SB_URL,SB_ANON);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={notdue:['ยังไม่ถึงกำหนด','#6b7cff'],overdue:['ค้างชำระ','#e00000'],pending:['รอตรวจสอบ','#f5a623'],paid:['ชำระแล้ว','#2a9d5c'],partial:['ชำระบางส่วน','#c77d00'],rejected:['ปฏิเสธหลักฐาน','#c0392b'],need_info:['ต้องการข้อมูลเพิ่มเติม','#d68910'],cancelled:['ยกเลิกรายการ','#888']};
const stl=s=>`<b style="color:${(ST[s]||ST.notdue)[1]}">${(ST[s]||ST.notdue)[0]}</b>`;
const DORMS=['หอพักญะมาอะห์ชาย','หอพักญะมาอะห์หญิง','หอพักกีฬา','หอพักฮาฟิซอัลกุรอ่าน'];
const MENU=[['dash','DASHBOARDS สรุป'],['stu','ข้อมูลนักเรียนทั้งหมด'],['bank','บอร์ดประชาสัมพันธ์/ธนาคาร'],['pay','ตรวจสอบค่าใช้จ่ายต่างๆ'],['slip','ตรวจสอบสลิปการโอน'],['gal','ภาพรวมสลิปการโอน'],['rep','ปริ้นรายงานข้อมูล'],['acc','สิทธิ์การเข้าถึง'],['log','ประวัติกิจกรรม']];
const itemName=f=>f.type=='fee'?'ค่าธรรมเนียมหอพัก':'ค่าอาหาร '+f.month;
const tm=t=>t?.toDate?t.toDate().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'-';
let me=null,terms=[],termId=null,page='dash',pend=[],unsub=null,idle;
const modal=h=>{$('#modal').hidden=false;$('#modal .mb').innerHTML=h};const closeM=()=>$('#modal').hidden=true;window.closeM=closeM;
const ask=(t,h)=>new Promise(r=>{modal(`<h3>⚠ ${t}</h3><div style="max-height:45vh;overflow:auto">${h}</div><p><b style="color:red">ข้อควรระวัง:</b> โปรดทบทวนรายการของท่านก่อนบันทึกข้อมูล หากแน่ใจโปรดกดยืนยัน หากทำผิดพลาดโปรดกดยกเลิก (ท่านยังคงใช้สิทธิ์ปรับปรุงข้อมูลได้ตลอดเวลา)</p><button class="bt g" id="y">✔ ยืนยัน</button> <button class="bt r" id="n">✖ ยกเลิก</button>`);$('#y').onclick=()=>{closeM();r(true)};$('#n').onclick=()=>{closeM();r(false)}});
const log=(action,detail,o,n,note)=>addDoc(collection(db,'logs'),{actor:me.username,uid:me.uid,action,detail:detail||'',old:o??null,new:n??null,note:note||'',at:serverTimestamp()});
const up=async(file,folder)=>{const p=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${file.name.split('.').pop()}`;const {error}=await sb.storage.from(BUCKET).upload(p,file,{contentType:file.type});if(error)throw error;return sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl};
if(LOGO)$('#logo').src=LOGO;else $('#logo').hidden=true;if(ANN)$('#ann').src=ANN;else $('#ann').hidden=true;
/* นาฬิกา real-time */
setInterval(()=>{const d=new Date(),z=(n,l=2)=>String(n).padStart(l,'0');
 if(!$('#login').hidden){$('#clk').textContent=`${z(d.getHours())} : ${z(d.getMinutes())} : ${z(d.getSeconds())}.${z(d.getMilliseconds(),3)} น.`;$('#dt').textContent=d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
 else $('#stamp').textContent=`ข้อมูล ณ วันที่ : ${d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})} เวลา ${z(d.getHours())} : ${z(d.getMinutes())} : ${z(d.getSeconds())} น.`},50);
/* เข้า/ออกระบบ */
$('#go').onclick=async()=>{let u=$('#u').value.trim();if(!u)return;if(!u.includes('@'))u+='@usk.ac.th';$('#err').textContent='';try{await signInWithEmailAndPassword(auth,u,$('#p').value)}catch(e){$('#err').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}};
$('#p').onkeydown=e=>e.key=='Enter'&&$('#go').click();
const out=async()=>{if(me){await log('ออกจากระบบ','ออกจากระบบการทำงานหลังบ้านสำเร็จ').catch(()=>{});}me=null;unsub&&unsub();await signOut(auth)};$('#out').onclick=out;
const rst=()=>{clearTimeout(idle);if(me)idle=setTimeout(out,IDLE_MIN*60000)};['click','keydown','mousemove'].forEach(e=>addEventListener(e,rst));
onAuthStateChanged(auth,async u=>{
 if(!u){me=null;$('#app').hidden=true;$('#login').hidden=false;return}
 if(me)return;const s=await getDoc(doc(db,'admins',u.uid));
 if(!s.exists()||!s.data().active){await signOut(auth);$('#err').textContent='บัญชีนี้ไม่มีสิทธิ์เข้าใช้งาน หรือถูกปิดใช้งาน';return}
 me={uid:u.uid,...s.data()};$('#login').hidden=true;$('#app').hidden=false;$('#un').textContent=$('#un2').textContent=me.username;
 $('#nav').innerHTML=MENU.map(m=>`<a data-p="${m[0]}">${m[1]}</a>`).join('');$('#nav').onclick=e=>{const p=e.target.dataset.p;if(p){$('#side').classList.remove('open');go(p)}};
 unsub=onSnapshot(query(collection(db,'payments'),where('status','==','pending')),q=>{pend=q.docs.map(d=>({id:d.id,...d.data()}));$('#bn').textContent=pend.length;$('#bn').hidden=!pend.length});
 log('เข้าสู่ระบบ','เข้าสู่ระบบการทำงานหลังบ้านสำเร็จ');rst();go('dash')});
$('#mn').onclick=()=>$('#side').classList.toggle('open');$('#rf').onclick=()=>go(page);
$('#bell').onclick=()=>{const b=$('#bd');b.hidden=!b.hidden;b.innerHTML=pend.length?pend.map(p=>`<div data-i="${p.id}">${esc(p.studentName)} — ${esc(itemName(p))} <small>${tm(p.createdAt)}</small></div>`).join(''):'ไม่มีรายการรอตรวจสอบ';
 b.onclick=async e=>{const i=e.target.closest('[data-i]')?.dataset.i;if(!i)return;b.hidden=true;await go('slip');const p=pend.find(x=>x.id==i);p&&detail(p)}};
/* ภาคเรียน */
const loadTerms=async()=>{terms=(await getDocs(collection(db,'terms'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.year-a.year||String(a.term).localeCompare(a.term));if(!terms.find(t=>t.id==termId))termId=(terms.find(t=>t.isDefault)||terms[0]||{}).id||null};
const termSel=()=>`<select id="ts">${terms.map(t=>`<option value="${t.id}" ${t.id==termId?'selected':''}>${esc(t.label)}</option>`).join('')||'<option value="">ยังไม่มีภาคเรียน</option>'}</select>`;
const bindTs=()=>{const s=$('#ts');if(s)s.onchange=e=>{termId=e.target.value;go(page)}};
const getStu=async()=>termId?(await getDocs(query(collection(db,'students'),where('termId','==',termId)))).docs.map(d=>({id:d.id,...d.data()})):[];
const getFees=async()=>termId?(await getDocs(query(collection(db,'fees'),where('termId','==',termId)))).docs.map(d=>({id:d.id,...d.data()})):[];
const csv=(rows,name)=>{const t='\ufeff'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'.csv';a.click()};
const P={dash,stu,bank,pay,slip:()=>slip(0),gal:()=>slip(1),rep,acc,log:logs};
async function go(p){page=p;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));$('#pt').textContent=MENU.find(m=>m[0]==p)[1];$('#main').innerHTML='กำลังโหลด...';
 try{await loadTerms();await P[p]();bindTs()}catch(e){$('#main').innerHTML='<p style="color:red">เกิดข้อผิดพลาด: '+esc(e.message)+'</p>'}}
/* ===== Dashboard ===== */
async function dash(){
 const [S,F]=await Promise.all([getStu(),getFees()]),t=terms.find(x=>x.id==termId),M=t?.months||[];
 const by=f=>{const ids=new Set(F.filter(f).map(x=>x.studentId));return S.filter(s=>ids.has(s.id))};
 const cards=[['นักเรียนหอพักทั้งหมด',S],['นักเรียนที่รอตรวจสอบสถานะ',by(x=>x.status=='pending')],['นักเรียนที่ยังมีรายการค้างชำระ',by(x=>x.status=='overdue'||x.status=='partial')],['นักเรียนที่จ่ายค่าธรรมเนียมหอพักแล้ว',by(x=>x.type=='fee'&&x.status=='paid')],...M.map(m=>[`นักเรียนที่จ่ายค่าอาหารเดือน ${m} แล้ว`,by(x=>x.type=='meal'&&x.month==m&&x.status=='paid')])];
 $('#main').innerHTML=`<p>${termSel()} <input id="fq" placeholder="ค้นหาชื่อนักเรียน"> <select id="fd"><option value="">ทุกประเภทหอพัก</option>${DORMS.map(d=>`<option>${d}</option>`).join('')}</select></p><div class="grid" id="cg"></div>
 <h3>จัดการภาคเรียน / ปีการศึกษา</h3><div class="box"><select id="tn"><option value="1">ภาคเรียนที่ 1</option><option value="2">ภาคเรียนที่ 2</option><option value="3">ภาคเรียนที่ 3</option><option value="พิเศษ">ภาคเรียนพิเศษ</option></select> <input id="ty" size="10" placeholder="ปีการศึกษา 2569"> <input id="tmo" size="45" placeholder="เดือนที่เก็บค่าอาหาร (สูงสุด 6) คั่นด้วย , เช่น ตุลาคม,พฤศจิกายน"> <button class="bt" id="ta">เพิ่มภาคเรียน</button>
 <table><tr><th>ภาคเรียน<th>เดือน<th>แสดงในระบบผู้ปกครอง<th>ค่าเริ่มต้น</tr>${terms.map(x=>`<tr><td>${esc(x.label)}<td>${esc((x.months||[]).join(', '))}<td><input type="checkbox" data-v="${x.id}" ${x.visible?'checked':''}><td><input type="radio" name="df" data-d="${x.id}" ${x.isDefault?'checked':''}></tr>`).join('')}</table></div>`;
 const draw=()=>{const q=$('#fq').value,d=$('#fd').value,ok=s=>s.name.includes(q)&&(!d||s.dorm==d);
  $('#cg').innerHTML=cards.map((c,i)=>{const n=c[1].filter(ok).length,tot=S.filter(ok).length;return `<div class="card" data-i="${i}">${c[0]}<br><b>${n}</b> คน<br><small>${tot?(n*100/tot).toFixed(2):'0.00'} %</small></div>`}).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const k=cards[c.dataset.i];modal(`<h3>${k[0]}</h3><table>${k[1].filter(ok).map(s=>`<tr><td>${esc(s.name)}<td>${esc(s.dorm)}<td>${esc(s.level)}`).join('')}</table><p><button class="bt o" onclick="closeM()">ปิด</button></p>`)})};
 $('#fq').oninput=$('#fd').onchange=draw;draw();
 $('#ta').onclick=async()=>{const n=$('#tn').value,y=+$('#ty').value,mo=$('#tmo').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,6);if(!y)return alert('กรุณาระบุปีการศึกษา');
  const label=`ภาคเรียนที่ ${n} ปีการศึกษา ${y}`;if(n=='พิเศษ')label.replace('ที่ พิเศษ','พิเศษ');await setDoc(doc(db,'terms',`${y}-${n}`),{label:n=='พิเศษ'?`ภาคเรียนพิเศษ ปีการศึกษา ${y}`:label,term:n,year:y,months:mo,visible:true,isDefault:!terms.length},{merge:true});await log('เปลี่ยนการตั้งค่าที่สำคัญ','เพิ่ม/แก้ไข '+label);go('dash')};
 document.querySelectorAll('[data-v]').forEach(i=>i.onchange=async()=>{await updateDoc(doc(db,'terms',i.dataset.v),{visible:i.checked});log('เปลี่ยนการตั้งค่าที่สำคัญ','เปิด/ปิดการแสดงภาคเรียน '+i.dataset.v,!i.checked,i.checked)});
 document.querySelectorAll('[data-d]').forEach(i=>i.onchange=async()=>{const b=writeBatch(db);terms.forEach(x=>b.update(doc(db,'terms',x.id),{isDefault:x.id==i.dataset.d}));await b.commit();log('เปลี่ยนการตั้งค่าที่สำคัญ','ตั้งภาคเรียนเริ่มต้น '+i.dataset.d)})}

async function addStu(s,t){const b=writeBatch(db),r=doc(collection(db,'students'));b.set(r,{name:s.name,level:s.level||'',dorm:s.dorm,termId:t.id,createdAt:serverTimestamp()});

 const [S,F]=await Promise.all([getStu(),getFees()]),t=terms.find(x=>x.id==termId)||{};
 const cols=[{type:'fee',month:'',l:'ค่าธรรมเนียม'},...(t.months||[]).map(m=>({type:'meal',month:m,l:m}))];

 const draw=()=>{const R=S.filter(s=>s.dorm==dorm&&s.name.includes(q)),sOpt=v=>Object.keys(ST).map(k=>`<option value="${k}" ${k==v?'selected':''}>${ST[k][0]}</option>`).join('');

  $('#sa').onclick=()=>{R.forEach(s=>sel.add(s.id));draw()};

  if(k=='ok'){const paid=(fee.paid||0)+p.amount;b.update(doc(db,'fees',p.feeId),{paid,status:paid>=(fee.amount||0)?'paid':'partial',updatedBy:me.username,updatedAt:serverTimestamp()})}
  if(k=='rej')b.update(doc(db,'fees',p.feeId),{status:'rejected',updatedBy:me.username,updatedAt:serverTimestamp()});
  await b.commit();await log(k=='ok'?'อนุมัติสลิป':k=='rej'?'ปฏิเสธสลิป':'ขอข้อมูลเพิ่มเติมสลิป',`${p.studentName} ${itemName(p)} ${p.amount} บาท`,p.status,k,rs||note);closeM();done?done():go(page)})}

  $('#tb').innerHTML=`<h3>${esc($('#r').selectedOptions[0].text)}</h3><p>${esc(terms.find(t=>t.id==termId)?.label||'')} | สร้างรายงานเมื่อ ${D.toLocaleString('th-TH')}</p><table><tr>${H.map(h=>`<th>${h}`).join('')}</tr>${L.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}`).join('')}</tr>`).join('')}</table>${r=='full'?'':`<p><b>ยอดรับเงินที่ยืนยันแล้ว: ${L.reduce((a,x)=>a+x[4],0)} บาท</b> (ไม่รวมรายการรอตรวจสอบ/ถูกปฏิเสธ)</p>`}`};
 document.querySelectorAll('#r,#d,#q').forEach(e=>e.oninput=draw);draw();
